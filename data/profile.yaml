    summary:
      es: >
        Ingeniero de software fullstack con más de 15 años de experiencia. PHP fue mi lenguaje
        principal entre 2008 y 2021: sistemas de gestión interna y reportería para retail,
        software ERP-CRM y pedidos en línea, plataformas municipales y, en el Gobierno de Chile,
