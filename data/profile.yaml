        Desde 2021 trabajo en Ruby on Rails, hoy como miembro del equipo fundador de CaptaLog,
        donde diseño, construyo y opero una plataforma web y una aplicación móvil en producción
        sobre MySQL 8 en Amazon RDS: APIs REST, autenticación OpenID Connect con PKCE, pruebas
        automatizadas en cada commit y desarrollo asistido por agentes de IA bajo revisión
        humana. Me incorporo a sistemas que no escribí, incluidos entornos legacy sin
        documentación, y los extiendo sin romper lo que ya funciona.
      en: >
        Fullstack software engineer with 15+ years of experience. PHP was my main language from
        2008 to 2021: internal management and reporting systems for retail, ERP-CRM and online
        ordering software, municipal platforms and, inside the Chilean government, the full
        rewrite of SIEC3, the national police's road accident statistics system, in Symfony with
        Doctrine and Twig. I adopted PHP 7 and then PHP 8 as they came out, while much of the
        industry preferred to stay on PHP 5.

        Since 2021 I have worked in Ruby on Rails, today as a founding team member at CaptaLog,
        where I design, build and run a web platform and a mobile app in production on MySQL 8
        on Amazon RDS: REST APIs, OpenID Connect authentication with PKCE, automated tests on
        every commit and agent-assisted development under human review. I join systems I did
        not write, including undocumented legacy environments, and extend them without breaking
        what already works.

    specialties:
