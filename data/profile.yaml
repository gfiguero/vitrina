tagline:
  es: >-
    Construyo software para operaciones donde el terreno está sin conexión, lo que está en
    juego es físico y el papeleo es una obligación legal.
  en: >-
    I build software for operations where the field is offline, the stakes are physical,
    and the paperwork is a legal obligation.

