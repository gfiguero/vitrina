projects:
  - id: captalog
    name: Captalog
    weight: 100
    featured: true
    status: live
    url: https://www.captalog.com
    repo: null
    role: { es: Fundador y responsable técnico, en: Founder and technical lead }
    period: "2024 —"
    stack: [Ruby on Rails 8, React Native, Expo, MySQL 8, Amazon RDS, EC2, Go, MCP]
    tags: [saas, offline-first, movil, cumplimiento, ia]
    summary:
      es: >-
        Plataforma offline-first de cumplimiento normativo y seguridad para construcción,
        minería y energía. Los equipos en terreno ejecutan pautas e inspecciones en faenas sin
        conectividad; todo sincroniza cuando puede y la traza de auditoría tiene que sostenerse
        después.
      en: >-
        Offline-first platform for safety compliance in construction, mining and energy. Field
        teams run checklists and inspections on sites with no connectivity; everything syncs
        when it can, and the audit trail has to hold up afterwards.
    highlights:
      - es: >-
          Monolito Rails que sirve la aplicación web y la API móvil: pautas, inspecciones,
          tareas, incidencias y dashboards.
        en: >-
          Rails monolith serving both the web app and the mobile API: checklists, inspections,
          tasks, incidents and dashboards.
      - es: >-
          App React Native (Expo) offline-first, no "tolerante a desconexión": la base de datos
          local es la fuente de verdad hasta que la sincronización diga lo contrario.
        en: >-
          React Native (Expo) app built offline-first, not offline-tolerant: the local database
          is the source of truth until sync says otherwise.
      - es: "CLI en Go con OAuth2 y salida JSON, de modo que la plataforma sea scriptable."
        en: "Go CLI with OAuth2 and JSON output, so the platform is scriptable."
      - es: >-
          Servidor MCP que expone la plataforma a asistentes de IA: crear tareas, editar y
          publicar pautas, gestionar incidencias y consultar documentación.
        en: >-
          MCP server exposing the platform to AI assistants: create tasks, edit and publish
          checklists, manage issues and query documentation.

