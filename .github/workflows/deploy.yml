name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Debe ir antes de setup-node para que `cache: pnpm` encuentre el store.
      # La versión sale del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falla temprano si falta una traducción o un campo obligatorio.
      - name: Validar datos
        run: pnpm run check

      # Chrome ya viene instalado en los runners de ubuntu-latest.
      - name: Generar CV en PDF
        run: pnpm run cv
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Generar imagen para compartir
        run: pnpm run og
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Generar exports
        run: pnpm run exports

      - name: Construir sitio
        run: pnpm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
