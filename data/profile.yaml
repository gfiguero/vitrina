    headline:
      es: "Ingeniero de Software Fullstack · Producto Digital e IA Aplicada"
      en: "Fullstack Software Engineer · Digital Product and Applied AI"

    tagline:
      es: >-
        Llevo producto digital de punta a punta —web, móvil y las integraciones que los
        conectan— y trabajo dentro del loop de desarrollo agéntico, con el criterio técnico
        siempre del lado humano.
      en: >-
        I take digital product end to end — web, mobile and the integrations between them — and
        work inside the agentic development loop, with technical judgement always on the human
        side.

    summary:
      es: >
        Ingeniero de software fullstack con más de 15 años construyendo y sosteniendo productos
        digitales en producción: aplicaciones web, aplicaciones móviles para iOS y Android, y las
        APIs e integraciones que las conectan. Cubro el ciclo completo, desde el levantamiento y
        la arquitectura hasta las pruebas, el despliegue y la operación, y decido sobre
        infraestructura cloud considerando costo y límite de escalabilidad, no sólo capacidad
        técnica.

        Uso inteligencia artificial generativa como parte del trabajo diario en los dos sentidos:
        desarrollo asistido por agentes bajo revisión humana, y construcción de servidores MCP
        que exponen una plataforma a asistentes de IA con su modelo de dominio y sus permisos. Me
        interesa particularmente tomar prototipos que ya demuestran una idea y llevarlos a
        soluciones que aguanten producción, con seguridad, pruebas y observabilidad.
      en: >
        Fullstack software engineer with 15+ years building and sustaining digital products in
        production: web applications, iOS and Android mobile apps, and the APIs and integrations
        that connect them. I cover the full cycle, from requirements and architecture through
        testing, deployment and operation, and I make cloud infrastructure decisions on cost and
        scalability limits, not only technical capability.

        I use generative AI as part of the daily work in both directions: agent-assisted
        development under human review, and building MCP servers that expose a platform to AI
        assistants with its domain model and its permissions. I am particularly interested in
        taking prototypes that already prove an idea and evolving them into solutions that hold
        up in production, with security, testing and observability.

