# Competencias técnicas agrupadas. `featured: true` sube el grupo al sitio.
groups:
  - id: languages
    label: { es: Lenguajes, en: Languages }
    featured: true
    items: [TypeScript, JavaScript, Ruby, PHP, Python, SQL, Java, .NET, HTML, CSS]
  - id: frameworks
    label: { es: Frameworks y entornos, en: Frameworks and runtimes }
    featured: true
    note:
      es: >-
        Node.js como entorno de ejecución habitual del trabajo en JavaScript y TypeScript:
        tooling de build, scripts de línea de comandos y suites de pruebas. En web, desarrollo
        de interfaces propias con React, Next.js y Astro.
      en: >-
        Node.js as the everyday runtime for JavaScript and TypeScript work: build tooling,
        command line scripts and test suites. On the web, building my own interfaces with
        React, Next.js and Astro.
    items: [Node.js, React, Next.js, Astro, Ruby on Rails, Symfony, CodeIgniter, Hotwire, Stimulus, Turbo, Tailwind, Bootstrap, jQuery]
  - id: mobile
    label: { es: Desarrollo móvil, en: Mobile }
    featured: true
    note:
      es: >-
        React Native sobre Expo, para iOS y Android. Arquitectura offline-first, estrategias de
        sincronización fire-and-forget y conciliación simétrica de datos. Publicación y
        mantención en App Store y Google Play.
      en: >-
        React Native on Expo, for iOS and Android. Offline-first architecture, fire-and-forget
        sync and symmetric data reconciliation. Shipping and maintaining on the App Store and
        Google Play.
    items: [React Native, Expo, Expo Router, TypeScript, Zustand, Drizzle ORM, SQLite, NativeWind, offline-first, App Store, Google Play]
  - id: databases
    label: { es: Bases de datos, en: Databases }
    featured: true
    note:
      es: "MySQL (incluida versión 8 sobre Amazon RDS), PostgreSQL, DB2. Diseño relacional y consultas avanzadas."
      en: "MySQL (including 8 on Amazon RDS), PostgreSQL, DB2. Relational design and advanced queries."
    items: [MySQL, PostgreSQL, SQLite, DB2, Amazon RDS]
  - id: infra
    label: { es: Infraestructura y DevOps, en: Infrastructure and DevOps }
    featured: true
    items: [AWS EC2, AWS RDS, S3, CloudFront, CloudFormation, Linux (Ubuntu, CentOS), Docker, Kamal, Git, VPS, cloud security]
  - id: architecture
    label: { es: Arquitectura e integración, en: Architecture and integration }
    featured: true
    note:
      es: >-
        Diseño e integración de APIs REST. Dominio a nivel de especificación del protocolo HTTP:
        semántica de métodos, PATCH y comportamiento de caché.
      en: >-
        REST API design and integration. HTTP at specification level: method semantics, PATCH
        and cache behaviour.
    items: [REST, HTTP, OAuth2, OpenID Connect, PKCE, Clave Única, webhooks, sincronización offline, ingesta IoT]
  - id: quality
    label: { es: Calidad, pruebas y observabilidad, en: Quality, testing and observability }
    featured: true
    note:
      es: >-
        Jest con suites unitarias y de integración separadas, Testing Library, Minitest y
        Capybara para pruebas de sistema, cobertura medida con SimpleCov. Análisis estático de
        seguridad con Brakeman y eslint-plugin-security; RuboCop, ESLint y Prettier ejecutados
        en cada commit. Observabilidad en producción con Sentry.
      en: >-
        Jest with separate unit and integration suites, Testing Library, Minitest and Capybara
        for system tests, coverage measured with SimpleCov. Static security analysis with
        Brakeman and eslint-plugin-security; RuboCop, ESLint and Prettier on every commit.
        Production observability with Sentry.
    items: [Jest, Testing Library, Minitest, Capybara, SimpleCov, Brakeman, ESLint, RuboCop, Sentry]

  - id: ai
    label: { es: Inteligencia artificial aplicada, en: Applied AI }
    featured: true
    note:
      es: >-
        Dos frentes. Construir para la IA: servidores MCP propios que exponen una plataforma a
        asistentes, con su modelo de dominio y sus permisos. Y desarrollar con ella: Claude Code
        y opencode como entorno agnóstico de modelo, modelos locales vía Ollama cuando el código
        no puede salir de la máquina, y un flujo de trabajo agéntico con un worktree por tarea y
        revisión humana antes de integrar.
      en: >-
        Two fronts. Building for AI: in-house MCP servers exposing a platform to assistants,
        with its domain model and its permissions. And building with it: Claude Code and
        opencode as a model-agnostic harness, local models through Ollama when the code cannot
        leave the machine, and an agentic workflow with one worktree per task and human review
        before merging.
    items: [MCP, Claude Code, opencode, Ollama, modelos locales, LLM tooling]
  - id: documents
    label: { es: Documentación digital, en: Digital documents }
    featured: false
    note:
      es: >-
        Firma electrónica y su validez legal en marcos ESIGN/UETA y equivalentes
        latinoamericanos; evaluación de soluciones open source de firma documental.
      en: >-
        Electronic signature and its legal validity under ESIGN/UETA and Latin American
        equivalents; evaluation of open source document signing solutions.
    items: [firma electrónica, PDF, verificación por QR]
  - id: other
    label: { es: Otras capacidades, en: Other capabilities }
    featured: false
    items:
      - { es: Ingeniería inversa y reconstrucción de software sin documentación, en: Reverse engineering and reconstruction of undocumented software }
      - { es: Levantamiento de requerimientos, en: Requirements gathering }
      - es: Servicios públicos digitales con el Kit Digital de gob.cl y criterios de accesibilidad
        en: Public digital services with the gob.cl Digital Kit and accessibility criteria
      - es: "Agendamiento y asignación de horas: colas, flujos de atención y ventanas de tiempo"
        en: "Scheduling and appointment allocation: queues, service flows and time windows"
      - { es: Contenerización de aplicaciones y servicios, en: Containerising applications and services }
      - es: >-
          Automatización en Python: herramientas de línea de comandos, sincronización incremental
          contra APIs externas y análisis de datos sobre SQLite.
        en: >-
          Automation in Python: command line tools, incremental synchronisation against external
          APIs and data analysis over SQLite.

languages_spoken:
  - name: { es: Español, en: Spanish }
    level: { es: Nativo, en: Native }
  - name: { es: Inglés, en: English }
    level: { es: Profesional, en: Professional working proficiency }
