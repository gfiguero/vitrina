summary:
  es: >
    Ingeniero de software con más de 15 años de experiencia en desarrollo fullstack,
    administración de infraestructura y servicios en la nube. Trayectoria consolidada en
    proyectos del Estado y de gobiernos locales: desarrollo del sistema de administración de
    recursos para la ficha social de la Dirección de Desarrollo Comunal de la Municipalidad de
    Quillota, y participación en proyectos estratégicos para la Comisión Nacional de Seguridad
    de Tránsito, Carabineros de Chile, el Ministerio de Transportes y Telecomunicaciones, el
    Ministerio de Salud y el Registro Civil.

    Actualmente soy ingeniero de software y miembro del equipo fundador de CaptaLog,
    plataforma SaaS de inspecciones en terreno y cumplimiento normativo para industrias
    pesadas en Latinoamérica. Trabajo cómodo muy por debajo de la capa de aplicación cuando el
    problema lo exige.
  en: >
    Software engineer with 15+ years across fullstack development, infrastructure
    administration and cloud services. A consolidated track record in national and local
    government projects: built the resource management system for the social registry at the
    Community Development Department of the Municipality of Quillota, and worked on strategic
    projects for Chile's National Road Safety Commission, the national police force, the
    Ministry of Transport and Telecommunications, the Ministry of Health and the Civil
    Registry.

    Today I am a software engineer and founding team member at CaptaLog, a SaaS
    platform for field inspections and regulatory compliance in Latin American heavy industry.
    I am comfortable well below the application layer when a problem demands it.

# Ejes de especialización: lo que te diferencia, no lo que sabes usar.
specialties:
  - es: >-
      Integración de inteligencia artificial en flujos de trabajo internos mediante Model
      Context Protocol (MCP).
    en: >-
      Integrating AI into internal workflows through the Model Context Protocol (MCP).
  - es: >-
      Aplicaciones móviles offline-first para trabajo en terreno: captura de información sin
      conectividad y sincronización posterior con conciliación de datos, aplicable a sectores
      rurales o con cobertura deficiente.
    en: >-
      Offline-first mobile apps for field work: capture without connectivity and later
      synchronisation with data reconciliation, applicable to rural or poorly covered areas.
  - es: >-
      Digitalización de procesos de fiscalización e inspección: pautas de inspección,
      levantamiento de observaciones en terreno, seguimiento de acciones correctivas y
      trazabilidad auditable.
    en: >-
      Digitising inspection and enforcement processes: inspection checklists, field
      observations, corrective action tracking and an auditable trail.
  - es: >-
      Gestión ambiental digitalizada: sistemas de cálculo de huella de carbono y de gestión de
      residuos, aplicables a reportería ambiental municipal y seguimiento de ordenanzas de
      reciclaje.
    en: >-
      Digitised environmental management: carbon footprint and waste management systems,
      applicable to municipal environmental reporting and recycling compliance.
  - es: >-
      Administración de infraestructura y servicios cloud, con dimensionamiento y control de
      costos para presupuestos acotados.
    en: >-
      Infrastructure and cloud services administration, with sizing and cost control for
      constrained budgets.
  - es: >-
      Integración entre plataformas y bases de datos de reparticiones públicas, incluyendo
      entornos legacy sin documentación.
    en: >-
      Integration between public sector platforms and databases, including undocumented legacy
      environments.
  - es: >-
      Modernización de trámites: digitalización documental, firma electrónica y automatización
      de flujos administrativos.
    en: >-
      Modernising bureaucratic procedures: document digitisation, electronic signature and
      administrative workflow automation.
  - es: >-
      Sistemas de gestión social y atención al vecino: ficha social, registro de beneficiarios
      y gestión de información para comunidades vecinales.
    en: >-
      Social management and citizen-facing systems: social registry, beneficiary records and
      information management for neighbourhood communities.

# Variantes de posicionamiento para una postulación concreta. Sólo afectan al CV generado
# (`npm run cv -- --variant <id>`); el sitio siempre publica el perfil por defecto.
# Una variante reescribe headline, tagline, summary y specialties: el mismo recorrido contado
# para otra audiencia. La experiencia, las competencias y la educación no cambian nunca.
variants:
  corporate:
    label:
      es: "Producto digital corporativo e IA aplicada"
      en: "Corporate digital product and applied AI"

    headline:
      es: "Ingeniero de Software Fullstack · Producto Digital e IA Aplicada"
      en: "Fullstack Software Engineer · Digital Product and Applied AI"

    tagline:
      es: >-
        Llevo producto digital de punta a punta —web, móvil y las integraciones que los
        conectan— y trabajo dentro del loop de desarrollo agéntico, con el criterio técnico
        siempre del lado humano.
      en: >-
        I take digital product end to end — web, mobile and the integrations between them — and
        work inside the agentic development loop, with technical judgement always on the human
        side.

    summary:
      es: >
        Ingeniero de software fullstack con más de 15 años construyendo y sosteniendo productos
        digitales en producción: aplicaciones web, aplicaciones móviles para iOS y Android, y las
        APIs e integraciones que las conectan. Cubro el ciclo completo, desde el levantamiento y
        la arquitectura hasta las pruebas, el despliegue y la operación.

        Uso inteligencia artificial generativa en los dos sentidos: desarrollando con agentes
        bajo revisión humana, y construyendo plataformas que los asistentes puedan operar. Me
        interesa el tramo que va del prototipo que ya prueba una idea a la solución que aguanta
        producción.
      en: >
        Fullstack software engineer with 15+ years building and sustaining digital products in
        production: web applications, iOS and Android mobile apps, and the APIs and integrations
        that connect them. I cover the full cycle, from requirements and architecture through
        testing, deployment and operation.

        I use generative AI in both directions: building with agents under human review, and
        building platforms that assistants can operate. I am interested in the stretch that runs
        from the prototype that proves an idea to the solution that holds up in production.

    specialties:
      - es: >-
          Desarrollo fullstack web y móvil sobre una misma base de producto: TypeScript en el
          cliente, con React Native en producción y React, Next.js y Astro en web; APIs REST y
          bases de datos relacionales en el servidor.
        en: >-
          Fullstack web and mobile development on a single product base: TypeScript on the
          client, with React Native in production and React, Next.js and Astro on the web; REST
          APIs and relational databases on the server.
      - es: >-
          Diseño de integraciones entre sistemas mediante contratos versionados, de modo que una
          divergencia entre dos lados aparezca en integración continua y no en producción.
        en: >-
          Designing system integrations through versioned contracts, so divergence between two
          sides surfaces in CI rather than in production.
      - es: >-
          Prácticas de calidad sostenidas: pruebas unitarias, de integración y de sistema,
          cobertura medida, análisis estático de seguridad y observabilidad en producción.
        en: >-
          Sustained quality practice: unit, integration and system tests, measured coverage,
