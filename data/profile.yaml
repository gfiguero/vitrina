          RDS, S3 and CloudFront.

  platform:
    label:
      es: "Ingeniería de plataforma con Ruby on Rails y React"
      en: "Platform engineering with Ruby on Rails and React"

    headline:
      es: "Ingeniero de Software Senior · Ruby on Rails, React y Plataforma"
      en: "Senior Software Engineer · Ruby on Rails, React and Platform"

    tagline:
      es: >-
        Construyo con Ruby on Rails y React las APIs, contratos y componentes de los que dependen
        otros equipos y aplicaciones, con pruebas en cada commit y responsabilidad sobre lo que
        corre en producción.
      en: >-
        I build the APIs, contracts and components that other teams and applications depend on,
        with Ruby on Rails and React, tests on every commit and ownership of what runs in
        production.

    summary:
      es: >
        Ingeniero de software fullstack con más de 15 años de experiencia, los últimos cinco en
        Ruby on Rails. Lideré técnicamente el desarrollo en AIM Manager, donde diseñé un sistema
        de permisos con control de acceso por ventanas de tiempo, y hoy, como miembro del equipo
        fundador de CaptaLog, diseño, construyo y opero una plataforma web en Rails 8 y una
        aplicación móvil en React Native y TypeScript, sobre MySQL 8 en Amazon RDS.

        Mi trabajo tiende a ser de plataforma: la autenticación OpenID Connect con PKCE de la que
        dependen la web y el móvil, contratos de sincronización versionados que el backend publica
        y la app consume como fixtures, para que una divergencia falle en CI y no en terreno, y un
        servidor MCP que expone el dominio de la plataforma a asistentes de IA. Escribo pruebas
        unitarias, de integración y de sistema con cobertura medida, me hago cargo de los
        incidentes en producción y documento lo que construyo para quienes lo van a usar.
      en: >
        Fullstack software engineer with 15+ years of experience, the last five in Ruby on Rails.
        I led development technically at AIM Manager, where I designed a permissions system with
        time-window access control, and today, as a founding team member at CaptaLog, I design,
        build and run a Rails 8 web platform and a React Native and TypeScript mobile app, on
        MySQL 8 on Amazon RDS.

        My work tends to be platform work: the OpenID Connect with PKCE authentication that both
        web and mobile rely on, versioned sync contracts that the backend publishes and the app
        consumes as fixtures, so divergence fails in CI rather than in the field, and an MCP
        server that exposes the platform domain to AI assistants. I write unit, integration and
        system tests with measured coverage, own production incidents, and document what I build
        for the people who will use it.

    specialties:
      - es: >-
          Backend en Ruby on Rails: APIs REST, modelado de dominio y diseño relacional sobre MySQL
          y PostgreSQL.
        en: >-
          Ruby on Rails backend: REST APIs, domain modelling and relational design on MySQL and
          PostgreSQL.
      - es: >-
          Funcionalidad compartida de la que dependen otras aplicaciones: autenticación OpenID
          Connect con PKCE, permisos por recurso y ventanas de tiempo, y contratos de API
          versionados y verificados en CI.
        en: >-
          Shared functionality other applications depend on: OpenID Connect authentication with
          PKCE, per-resource permissions with time windows, and versioned API contracts verified
          in CI.
      - es: >-
          Frontend en TypeScript con React y React Native, y Hotwire del lado de Rails.
        en: >-
          Frontend in TypeScript with React and React Native, and Hotwire on the Rails side.
      - es: >-
          Calidad sostenida: Minitest y Capybara, Jest con suites separadas de unidad e
          integración, cobertura medida, análisis estático de seguridad y linters en cada commit.
        en: >-
          Sustained quality practice: Minitest and Capybara, Jest with separate unit and
          integration suites, measured coverage, static security analysis and linters on every
          commit.
      - es: >-
          Responsabilidad en producción: observabilidad con Sentry, diagnóstico de fallas que no
          se reproducen en el escritorio y estabilización de sistemas con usuarios activos.
        en: >-
          Production ownership: observability with Sentry, diagnosing failures that do not
          reproduce on a desk, and stabilising live systems with active users.
      - es: >-
          Liderazgo técnico y mentoría: propuestas técnicas con sus trade-offs, revisión de
          código, contraparte técnica de proveedores externos y años como ayudante y tutor
          universitario.
        en: >-
          Technical leadership and mentoring: technical proposals with their trade-offs, code
          review, technical counterpart to external vendors, and years as a university teaching
          assistant and tutor.
      - es: >-
          Sistemas existentes y sin documentación: ingeniería inversa, refactorización y, cuando
          hace falta, reescrituras completas como SIEC3.
        en: >-
          Existing and undocumented systems: reverse engineering, refactoring and, when needed,
          full rewrites such as SIEC3.

